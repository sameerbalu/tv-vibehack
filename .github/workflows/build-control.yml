name: Build TV Control APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'tvcontrol/**'
      - '.github/workflows/build-control.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: tvcontrol
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: tvcontrol-v1-apk
          path: tvcontrol/app/build/outputs/apk/debug/app-debug.apk
