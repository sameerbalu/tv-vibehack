plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvcontrol'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvcontrol'
        minSdk 26
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion', 'ProtectedPermissions'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
